<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from './three.min.js';
const params = new URLSearchParams(location.search);
const W = +params.get('w') || 480, H = +params.get('h') || 640;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: false });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const cam = new THREE.PerspectiveCamera(24, W / H, 0.1, 100);
cam.position.set(0, 1.3, 7.7); cam.lookAt(0, 1.0, 0);

const key = new THREE.DirectionalLight(0xfff0dc, 2.4); key.position.set(3, 5, 5); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.camera.left = -2; key.shadow.camera.right = 2; key.shadow.camera.top = 3; key.shadow.camera.bottom = -1; key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6b78ff, 2.2); rim.position.set(-4, 3, -4); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-3, 1, 5); scene.add(fill);

// ---------- materials ----------
const M = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.55, metalness: 0, clearcoat: 0.25, clearcoatRoughness: 0.6, ...o });
const jacket = M(0xf4a51c, { roughness: 0.62, sheen: 0.4, sheenColor: new THREE.Color(0xffd27a) });
const jacketDark = M(0xd78a0e, { roughness: 0.7 });
const pants = M(0x2b2e36, { roughness: 0.8, clearcoat: 0 });
const shoe = M(0x16171b, { roughness: 0.5 });
const sole = M(0xe9e7e2, { roughness: 0.6 });
const skin = M(0xf1c6a3, { roughness: 0.5, clearcoat: 0.35, sheen: 0.3, sheenColor: new THREE.Color(0xffc9b0) });
const hair = M(0x141519, { roughness: 0.45, clearcoat: 0.5 });
const black = M(0x121316, { roughness: 0.35, clearcoat: 0.6 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0x0a0c16, roughness: 0.05, metalness: 0.2, clearcoat: 1, envMapIntensity: 1.5 });
const metal = M(0x8a8f99, { metalness: 0.8, roughness: 0.3 });
const strap = M(0x1d1f25, { roughness: 0.7 });
const white = M(0xf5f5f2, { roughness: 0.5 });

const cast = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };
const mesh = (geo, mat) => cast(new THREE.Mesh(geo, mat));
const capsule = (r, l, mat) => mesh(new THREE.CapsuleGeometry(r, l, 8, 24), mat);

// ---------- rig ----------
const root = new THREE.Group(); scene.add(root);
// legs
const hipY = 0.92;
for (const s of [-1, 1]) {
  const leg = capsule(0.13, 0.62, pants); leg.position.set(s * 0.14, hipY - 0.43, 0); root.add(leg);
  const shoeM = mesh(new THREE.CapsuleGeometry(0.12, 0.2, 6, 16), shoe); shoeM.rotation.x = Math.PI / 2; shoeM.scale.set(1, 1, 0.8); shoeM.position.set(s * 0.15, 0.1, 0.07); root.add(shoeM);
  const soleM = mesh(new THREE.BoxGeometry(0.24, 0.05, 0.46), sole); soleM.position.set(s * 0.15, 0.03, 0.07); root.add(soleM);
}
// torso group (twists a bit)
const torso = new THREE.Group(); torso.position.set(0, hipY, 0); root.add(torso);
const body = capsule(0.34, 0.5, jacket); body.scale.set(1, 1, 0.78); body.position.y = 0.42; torso.add(body);
const hem = mesh(new THREE.CylinderGeometry(0.345, 0.34, 0.08, 32), jacketDark); hem.scale.set(1, 1, 0.8); hem.position.y = 0.03; torso.add(hem);
const zip = mesh(new THREE.BoxGeometry(0.025, 0.72, 0.02), black); zip.position.set(0, 0.42, 0.268); torso.add(zip);
const collar = mesh(new THREE.TorusGeometry(0.19, 0.075, 12, 32), jacket); collar.rotation.x = Math.PI / 2; collar.position.y = 0.86; torso.add(collar);
const hood = mesh(new THREE.SphereGeometry(0.24, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), jacketDark); hood.rotation.x = -Math.PI / 2 - 0.4; hood.position.set(0, 0.84, -0.18); hood.scale.set(1.05, 0.8, 0.6); torso.add(hood);
// backpack + straps
const pack = mesh(new THREE.BoxGeometry(0.5, 0.62, 0.22), black); pack.position.set(0, 0.46, -0.34); torso.add(pack);
const packTop = capsule(0.11, 0.28, black); packTop.rotation.z = Math.PI / 2; packTop.position.set(0, 0.77, -0.34); torso.add(packTop);
for (const s of [-1, 1]) { const st = mesh(new THREE.BoxGeometry(0.07, 0.62, 0.03), strap); st.position.set(s * 0.17, 0.5, 0.26); st.rotation.x = -0.12; torso.add(st); }
// head
const neck = new THREE.Group(); neck.position.set(0, 0.92, 0); torso.add(neck);
const head = new THREE.Group(); head.position.set(0, 0.26, 0); neck.add(head);
const skull = mesh(new THREE.SphereGeometry(0.26, 40, 32), skin); skull.scale.set(0.95, 1.05, 1); head.add(skull);
const hairCap = mesh(new THREE.SphereGeometry(0.275, 40, 32, 0, Math.PI * 2, 0, Math.PI * 0.56), hair); hairCap.rotation.x = -0.35; hairCap.position.set(0, 0.03, -0.02); hairCap.scale.set(0.97, 1.05, 1.02); head.add(hairCap);
const fringe = mesh(new THREE.SphereGeometry(0.2, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.35), hair); fringe.position.set(0.02, 0.12, 0.12); fringe.rotation.x = 0.9; fringe.scale.set(1.2, 0.6, 1); head.add(fringe);
for (const s of [-1, 1]) {
  const ear = mesh(new THREE.SphereGeometry(0.055, 16, 12), skin); ear.scale.set(0.5, 1, 0.8); ear.position.set(s * 0.245, -0.01, 0); head.add(ear);
  const eye = mesh(new THREE.SphereGeometry(0.03, 16, 12), black); eye.position.set(s * 0.085, 0.0, 0.235); eye.scale.set(1, 1.3, 0.6); head.add(eye);
  const shine = mesh(new THREE.SphereGeometry(0.009, 8, 8), white); shine.position.set(s * 0.085 + 0.01, 0.015, 0.254); head.add(shine);
  const brow = mesh(new THREE.CapsuleGeometry(0.012, 0.05, 4, 8), hair); brow.rotation.z = Math.PI / 2 + s * 0.12; brow.position.set(s * 0.09, 0.075, 0.228); head.add(brow);
}
const nose = mesh(new THREE.SphereGeometry(0.03, 12, 10), skin); nose.position.set(0, -0.045, 0.255); head.add(nose);
const mouth = mesh(new THREE.TorusGeometry(0.035, 0.008, 8, 16, Math.PI), M(0x9b4b3c)); mouth.rotation.z = Math.PI; mouth.position.set(0, -0.1, 0.235); head.add(mouth);

// arms + camera rig (aims with gaze)
const rig = new THREE.Group(); rig.position.set(0, 0.62, 0.05); torso.add(rig);
const cameraGrp = new THREE.Group(); cameraGrp.position.set(0, 0.02, 0.42); rig.add(cameraGrp);
const camBody = mesh(new THREE.BoxGeometry(0.36, 0.24, 0.16), black); cameraGrp.add(camBody);
const camTop = mesh(new THREE.BoxGeometry(0.14, 0.08, 0.12), black); camTop.position.set(0, 0.15, -0.01); cameraGrp.add(camTop);
const grip = mesh(new THREE.BoxGeometry(0.08, 0.22, 0.08), black); grip.position.set(0.15, -0.01, 0.07); cameraGrp.add(grip);
const lens = mesh(new THREE.CylinderGeometry(0.095, 0.1, 0.22, 32), black); lens.rotation.x = Math.PI / 2; lens.position.set(-0.02, -0.01, 0.19); cameraGrp.add(lens);
const ring = mesh(new THREE.TorusGeometry(0.097, 0.012, 8, 32), metal); ring.position.set(-0.02, -0.01, 0.25); cameraGrp.add(ring);
const lensGlass = mesh(new THREE.CircleGeometry(0.08, 32), glass); lensGlass.position.set(-0.02, -0.01, 0.302); cameraGrp.add(lensGlass);
const dot = mesh(new THREE.SphereGeometry(0.014, 8, 8), M(0xff3b30, { emissive: 0xff2a1a, emissiveIntensity: 0.6 })); dot.position.set(0.13, 0.08, 0.08); cameraGrp.add(dot);
// arms: upper arm from shoulder to elbow, forearm from elbow to camera side
const shoulders = [new THREE.Vector3(-0.36, 0.78, 0), new THREE.Vector3(0.36, 0.78, 0)];
const armParts = [];
for (let i = 0; i < 2; i++) {
  const upper = capsule(0.085, 0.3, jacket); const fore = capsule(0.078, 0.28, jacket); const hand = mesh(new THREE.SphereGeometry(0.07, 16, 12), skin); const cuff = mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.05, 16), jacketDark);
  torso.add(upper, fore, hand, cuff); armParts.push({ upper, fore, hand, cuff });
}
const placeLimb = (m, a, b) => { m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); };
function updateArms() {
  torso.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(torso.matrixWorld).invert();
  for (let i = 0; i < 2; i++) {
    const s = i === 0 ? -1 : 1;
    const handWorld = cameraGrp.localToWorld(new THREE.Vector3(s * 0.2, -0.04, i === 0 ? 0.02 : 0.05));
    const hand = handWorld.applyMatrix4(inv);
    const sh = shoulders[i];
    const mid = sh.clone().lerp(hand, 0.5); mid.x += s * 0.16; mid.y -= 0.16; mid.z -= 0.02;
    const p = armParts[i];
    placeLimb(p.upper, sh, mid); placeLimb(p.fore, mid, hand);
    p.hand.position.copy(hand); placeLimb(p.cuff, mid.clone().lerp(hand, 0.82), hand);
  }
}
// contact shadow
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), new THREE.ShadowMaterial({ opacity: 0.22 }));
shadowCatcher.rotation.x = -Math.PI / 2; shadowCatcher.receiveShadow = true;
const blob = new THREE.Mesh(new THREE.CircleGeometry(0.55, 48), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18, depthWrite: false }));
blob.rotation.x = -Math.PI / 2; blob.position.y = 0.002; blob.scale.set(1, 0.7, 1); scene.add(blob);

// ---------- pose for a gaze direction ----------
// theta: 0 = 12 o'clock (looking up), clockwise on the screen plane. amount: 0..1 of the cone.
const CONE_YAW = 0.66, CONE_PITCH = 0.5;
window.pose = (theta, amount = 1) => {
  const x = Math.sin(theta) * amount, y = Math.cos(theta) * amount;
  const yaw = x * CONE_YAW, pitch = -y * CONE_PITCH;           // look up = negative x-rotation
  torso.rotation.y = yaw * 0.32; torso.rotation.z = -x * 0.03;
  neck.rotation.set(pitch * 0.35, yaw * 0.25, 0);
  head.rotation.set(pitch * 0.9, yaw * 0.75, -x * 0.08);
  rig.rotation.set(pitch * 0.85, yaw * 0.62, 0);
  rig.position.y = 0.6 + Math.min(0, y) * 0.04;
  updateArms();
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
